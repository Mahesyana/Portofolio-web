<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="kamonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2453" />
      <stop offset="100%" stop-color="#a11b39" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Latar belakang lingkaran gelap sumi -->
  <circle cx="32" cy="32" r="30" fill="#121218" stroke="url(#kamonRing)" stroke-width="3.5" />

  <!-- Cincin motif Kamon khas Jepang (lingkaran putus-putus halus) -->
  <circle cx="32" cy="32" r="23" stroke="#3f3f46" stroke-width="1.2" stroke-dasharray="3 3" />

  <!-- Simbol Inisial 'M' (Mahesyana) bergaya modern minimalis -->
  <path d="M 22 41 L 22 23 L 32 34 L 42 23 L 42 41" stroke="#f4f4f5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Titik Aksen Kurenai Crimson Merah khas Kamon -->
  <circle cx="43" cy="21" r="3.2" fill="#ff2453" filter="url(#glow)" />
</svg>
